# Static site — no build step. The HTML is served straight from the repo root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images and the logo are content-stable; the HTML must stay fresh so a deploy
# is visible immediately rather than sitting behind a stale cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Gulf programme page is the latest GCC Prometric page, served from
# gcc.goocampusglobal.com (single source; the address here stays /gulf-pathway/).
# gulf-pathway/privacy.html is still a real file here, so it is served as before.
[[redirects]]
  from = "/gulf-pathway/"
  to = "https://gcc.goocampusglobal.com/"
  status = 200

[[redirects]]
  from = "/gulf-pathway/*"
  to = "https://gcc.goocampusglobal.com/:splat"
  status = 200
